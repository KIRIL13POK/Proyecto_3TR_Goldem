<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="header">

        <div class="header__barra contenedor">

            <nav class="navegacion">
                <a class="navegacion__link" href="index.html">Sobre Nosotros</a>
                <a class="navegacion__link" href="catalogo.html">Catalogo</a>
                <a class="navegacion__link" href="contacto.html">Contacto</a>
                <a class="navegacion__link" href="login.html">Iniciar Sesión</a>
            </nav>

        </div>

        <div class="contenido__header contenedor">
            <h1 class="header__h1">Golden Bakery Shop</h1>


            <div class="header__logo">
                <!--<img src="img/GOLDEN_logo.jpg" alt="Logo de tienda" width="400">-->
                <img src="img/GOLDEN_logo.webp" alt="Logo de tienda" width="400">
            </div>

        </div>
    </header>

    <main>
        <section class="login contenedor">

            <h2>Iniciar sesión</h2>

            <form class="formulario formulario--login">

                <div class="formulario__campo">
                    <label for="usuario">Usuario o email</label>
                    <input type="email" id="usuario" name="usuario" placeholder="usuario@email.com">
                </div>

                <div class="formulario__campo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Tu contraseña">
                </div>

                <button class="formulario__boton" type="submit">
                    Acceder
                </button>

            </form>

        </section>
    </main>

    <footer class="footer">

        <div class="footer__contenedor contenedor">

            <div class="footer__contacto">


                <p>Email: info@goldenbakeryshop.com</p>

                <p>Teléfono: +34 600 000 000</p>

                <p>A Coruña, Galicia</p>

            </div>

        </div>

        <p class="footer__copyright">
            &copy; 2026 Golden Bakery Shop. Todos los derechos reservados.
        </p>

    </footer>


</body>

</html>
